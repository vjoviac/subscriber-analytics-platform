name: subscriber-analytics-superset

services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - superset_postgres_data:/var/lib/postgresql/data

  superset:
    build:
      context: .
    image: subscriber-analytics-superset:6.0.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:?SNOWFLAKE_ACCOUNT is required}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:?SNOWFLAKE_USER is required}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:?SNOWFLAKE_ROLE is required}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:?SNOWFLAKE_WAREHOUSE is required}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:?SNOWFLAKE_DATABASE is required}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:?SNOWFLAKE_SCHEMA is required}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:?SNOWFLAKE_PRIVATE_KEY_PASSPHRASE is required}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8088"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "from urllib.request import urlopen; response = urlopen('http://localhost:8088/health', timeout=5); assert response.status == 200; assert response.read().decode().strip() == 'OK'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./secrets/snowflake_rsa_key.p8:/run/secrets/snowflake_rsa_key.p8:ro

volumes:
  superset_postgres_data: